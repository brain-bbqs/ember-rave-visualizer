name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: gh-pages-main

jobs:
  deploy:
    # Never in the template itself, where this would publish a placeholder page under the
    # placeholder CNAME. A generated app is not this repository, so the condition is true there
    # and the job runs; leaving the line in costs that app nothing.
    if: github.repository != 'brain-bbqs/bbqs-web-app-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Keep PR previews (managed by preview.yml) intact.
          clean-exclude: pr-preview/
          force: false
